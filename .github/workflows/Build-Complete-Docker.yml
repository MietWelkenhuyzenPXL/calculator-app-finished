name: Docker Example

on: workflow_dispatch

jobs:
  Build-and-test-nodejs:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read           # checks: write voor de JUnit-action, contents: read voor checkout. Rechten die je niet vermeldt, worden none. (zie Marketplace)
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with: 
          node-version: '18.x' # x = wildcard: de nieuwste versie die met 18 begint. Aanhalingstekens, zodat YAML het als tekst leest.
          cache: 'npm'         # cachet dependencies voor een volgende run > versnelt
      - name: Install dependencies
        run: npm ci            # Installeert exact de versies uit package-lock.json (reproduceerbaar). Faalt als dat bestand ontbreekt.
      - name: Run tests
        run: npm test -- --coverage # eerste --: geeft wat volgt door aan het script (jest); --coverage: Jest: meet de coverage > maakt map coverage met o.a. clover.xml aan
      - name: JUnit Report Action
        uses: mikepenz/action-junit-report@v6.6.1
        if: always()           # Voert deze step ook uit als een vorige step faalt.
        with:
          report_paths: ./junit.xml # Pad naar het bestand dat jest-junit maakt (standaard junit.xml in de hoofdmap): na te kijken in de documentatie of met een run.
          include_passed: true
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v1.7.0
        if: always()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          coverage-file: ./coverage/clover.xml

      # Docker
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
